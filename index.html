<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#141A26; --muted:#5A6477; --line:#DDE2EC;
  --brand:#2F45C5; --brand-ink:#FFFFFF; --soft:#E9ECF8;
  --c-i:#0B7A85; --c-d:#7A3DC2; --c-b:#B42318; --c-n:#A8650A; --c-o:#566073;
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1220; --surface:#171C2E; --ink:#E9ECF5; --muted:#9AA4BA; --line:#2A3150;
    --brand:#8EA0FF; --brand-ink:#0E1220; --soft:#222A4A;
    --c-i:#4DD0DB; --c-d:#C29BFF; --c-b:#FF8A7D; --c-n:#F2B35C; --c-o:#9AA4BA;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#171C2E; --ink:#E9ECF5; --muted:#9AA4BA; --line:#2A3150;
  --brand:#8EA0FF; --brand-ink:#0E1220; --soft:#222A4A;
  --c-i:#4DD0DB; --c-d:#C29BFF; --c-b:#FF8A7D; --c-n:#F2B35C; --c-o:#9AA4BA;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:16px 16px 40px}

/* Calendario */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 12px 12px}
.cal-top{display:flex;align-items:center;gap:8px;padding:0 4px 10px}
.cal-title{flex:1;margin:0;font-family:var(--serif);font-weight:400;font-size:1.5rem;line-height:1.1;text-transform:capitalize}
.cal-title small{font-family:var(--sans);font-size:.9rem;color:var(--muted);margin-left:6px;font-weight:500}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;display:grid;place-items:center}
.icon-btn:hover{background:var(--soft)}
.today-btn{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:.9rem}
.today-btn:hover{background:var(--soft)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow span{text-align:center;font-size:.78rem;font-weight:600;color:var(--muted);padding:4px 0 6px}
.day-cell{position:relative;aspect-ratio:1/1;max-height:50px;border:0;background:transparent;border-radius:14px;font-weight:500;font-size:1rem;display:grid;place-items:center}
.day-cell:hover{background:var(--soft)}
.day-cell.has::after{content:"";position:absolute;bottom:6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--muted);opacity:.6}
.day-cell.is-today{box-shadow:inset 0 0 0 2px var(--brand);font-weight:700}
.day-cell.is-sel{background:var(--brand);color:var(--brand-ink);font-weight:700}
.day-cell.is-sel.has::after{background:var(--brand-ink)}
.blank{pointer-events:none}

/* Día seleccionado */
.day{display:flex;align-items:center;gap:16px;margin:26px 4px 16px}
.bignum{font-family:var(--serif);font-size:5.2rem;line-height:.85;color:var(--brand);min-width:1.1ch}
.day-label{margin:0;font-family:var(--serif);font-size:1.5rem;line-height:1.15;text-transform:capitalize}
.day-meta{margin:4px 0 0;color:var(--muted);font-size:.95rem}

/* Filtros */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 10px;margin:0 -16px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.92rem;font-weight:500;display:inline-flex;gap:7px;align-items:center}
.chip .n{color:var(--muted);font-weight:600;font-size:.82rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.chip .dot{width:8px;height:8px;border-radius:50%}

/* Lista */
.events{list-style:none;margin:6px 0 0;padding:0}
.ev{display:grid;grid-template-columns:4.4rem 1fr;gap:12px;padding:16px 4px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.year{font-family:var(--serif);font-size:1.35rem;line-height:1.2}
.cat{display:flex;align-items:center;gap:7px;font-size:.85rem;font-weight:600;margin-bottom:2px}
.cat i{width:8px;height:8px;border-radius:50%;display:block}
.txt{margin:0;line-height:1.55}
.fade{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.empty{margin:18px 4px;padding:18px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
.empty p{margin:0 0 12px}
.empty button{border:0;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:12px;font-weight:600}
.source{margin:22px 4px 0;font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>

const today = new Date();

let viewY = sel.getFullYear(), viewM = sel.getMonth();
let filter = "all";
let liveOK = null;           // null = sin probar, true/false tras el primer intento
const cache = {};
let token = 0;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const keyOf = d => pad(d.getMonth()+1) + "-" + pad(d.getDate());
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();

/* ---------- Datos: Wikipedia en vivo, con datos de muestra como respaldo ---------- */
function classify(text){
  if (/batalla|guerra|asedio|ejército|ejercito|tropas|invasi|ataque|bombardeo|rendici|combate/i.test(text)) return "b";
  if (/invent|patent|prototipo|inaugura el primer|primer(a|o)? (tren|telégrafo|teléfono|avión|autom)/i.test(text)) return "i";
  if (/descubr|sonda|cohete|astronauta|satélite|satelite|misión|mision|expedici|llega a|aterriza|observ/i.test(text)) return "d";
  return "o";
}
async function loadLive(date){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), 6000);
  try{
    const url = "https://es.wikipedia.org/api/rest_v1/feed/onthisday/all/" + pad(date.getMonth()+1) + "/" + pad(date.getDate());
    const r = await fetch(url, {signal: ctl.signal});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const ev = (j.events||[]).map(e => [e.year, classify(e.text), e.text]);
    const bi = (j.births||[]).slice(0,8).map(e => [e.year, "n", e.text]);
    const all = ev.concat(bi).filter(x => x[0] != null);
    if(!all.length) throw new Error("vacío");
    return all;
  } finally { clearTimeout(t); }
}
async function getEvents(date){
  const k = keyOf(date);
  if(cache[k]) return cache[k];
  let res;
  if(liveOK !== false){
    try{ res = {items: await loadLive(date), source:"live"}; liveOK = true; }
    catch(e){ if(liveOK === null) liveOK = false; }
  }
  if(!res) res = {items: (D[k]||[]).slice(), source:"sample"};
  res.items.sort((a,b)=>a[0]-b[0]);
  cache[k] = res;
  return res;
}

/* ---------- Calendario ---------- */
function renderCalendar(){
  $("monthTitle").innerHTML = "";
  $("monthTitle").append(MONTHS[viewM]);
  const s = document.createElement("small"); s.textContent = viewY; $("monthTitle").append(s);
  const grid = $("grid"); grid.innerHTML = "";
  const offset = (new Date(viewY, viewM, 1).getDay() + 6) % 7;
  const days = new Date(viewY, viewM + 1, 0).getDate();
  for(let i=0;i<offset;i++){ const b=document.createElement("span"); b.className="day-cell blank"; grid.append(b); }
  for(let d=1; d<=days; d++){
    const date = new Date(viewY, viewM, d);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "day-cell" + (D[keyOf(date)] ? " has" : "") + (sameDay(date,today) ? " is-today" : "") + (sameDay(date,sel) ? " is-sel" : "");
    b.textContent = d;
    b.setAttribute("aria-label", d + " de " + MONTHS[viewM] + (D[keyOf(date)] ? ", con efemérides" : ""));
    if(sameDay(date,sel)) b.setAttribute("aria-current","date");
    b.addEventListener("click", ()=>{ sel = date; filter = "all"; renderAll(); });
    grid.append(b);
  }
}

/* ---------- Lista ---------- */
async function renderDay(){
  const my = ++token;
  $("bigNum").textContent = sel.getDate();
  $("dayLabel").textContent = WEEKDAYS[sel.getDay()];
  $("dayMeta").textContent = "Buscando efemérides…";
  $("chips").innerHTML = ""; $("list").innerHTML = ""; $("source").textContent = "";
  const {items, source} = await getEvents(sel);
  if(my !== token) return;

  const counts = {all: items.length};
  items.forEach(x => counts[x[1]] = (counts[x[1]]||0) + 1);
  if(filter !== "all" && !counts[filter]) filter = "all";

  $("dayMeta").textContent = sel.getDate() + " de " + MONTHS[sel.getMonth()] + " de " + sel.getFullYear() +
    (items.length ? " · " + items.length + (items.length===1 ? " efeméride" : " efemérides") : "");

  const chips = $("chips");
  if(items.length){
    const mk = (id, label, color) => {
      if(id !== "all" && !counts[id]) return;
      const b = document.createElement("button");
      b.type="button"; b.className="chip"; b.setAttribute("aria-pressed", String(filter===id));
      if(color){ const d=document.createElement("span"); d.className="dot"; d.style.background="var("+color+")"; b.append(d); }
      b.append(label + " ");
      const n=document.createElement("span"); n.className="n"; n.textContent=counts[id]; b.append(n);
      b.addEventListener("click", ()=>{ filter=id; renderDay(); });
      chips.append(b);
    };
    mk("all","Todo");
    Object.keys(CATS).forEach(k => mk(k, CATS[k].n, CATS[k].v));
  }

  const list = $("list");
  const shown = items.filter(x => filter==="all" || x[1]===filter);
  if(!items.length){
    const e = document.createElement("div"); e.className="empty";
    const p = document.createElement("p");
    p.textContent = "Este prototipo solo incluye efemérides de muestra para algunos días. La app real las cargará de Wikipedia para cualquier fecha.";
    e.append(p);
    const b = document.createElement("button"); b.type="button"; b.textContent="Ver el 12 de octubre";
    b.addEventListener("click", ()=>{ sel = new Date(today.getFullYear(), 9, 12); viewY=sel.getFullYear(); viewM=9; filter="all"; renderAll(); });
    e.append(b); list.append(e);
  }
  shown.forEach(([year, c, text]) => {
    const li = document.createElement("li"); li.className = "ev fade";
    const y = document.createElement("div"); y.className="year"; y.textContent = year;
    const body = document.createElement("div");
    const cat = document.createElement("div"); cat.className="cat"; cat.style.color = "var("+CATS[c].v+")";
    const dot = document.createElement("i"); dot.style.background = "currentColor";
    cat.append(dot, CATS[c].n === "Otros hechos" ? "Hecho histórico" : CATS[c].n.replace(/s$/,""));
    const p = document.createElement("p"); p.className="txt"; p.textContent = text;
    body.append(cat, p); li.append(y, body); list.append(li);
  });
  $("source").textContent = source==="live"
    ? "Fuente: Wikipedia, «Sucedió un día como hoy»."
    : "Datos de muestra incluidos en el prototipo. En la app empaquetada se leerán en vivo de Wikipedia.";
}

function renderAll(){ renderCalendar(); renderDay(); }

/* ---------- Eventos ---------- */
$("prevBtn").addEventListener("click", ()=>{ viewM--; if(viewM<0){viewM=11;viewY--;} renderCalendar(); });
$("nextBtn").addEventListener("click", ()=>{ viewM++; if(viewM>11){viewM=0;viewY++;} renderCalendar(); });
$("todayBtn").addEventListener("click", ()=>{
  sel = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  viewY = sel.getFullYear(); viewM = sel.getMonth(); filter="all"; renderAll();
});

renderAll();

/* Service worker: permite instalar la app y abrirla sin conexión */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}
</script>
</body>
</html>
